packages:
  - "apps/*"
  - "packages/*"
overrides:
  # ESLint and typescript-estree still require v10; patch GHSA-g3hv-75wg-m249.
  minimatch: 11.0.1
  # Keep all router serialization paths on the patched release.
  seroval: 1.6.11
  # Miniflare pins an older sharp; use a patched release until it updates.
  sharp: 0.35.5
  # Keep Miniflare and jsdom on the patched Undici 7 release.
  undici: 7.30.1
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
