packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Router allows this patched release, but a normal transitive refresh retains 1.5.4.
  seroval: 1.6.3
  # Miniflare pins an older sharp; use a patched release until it updates.
  sharp: 0.35.5
  # Keep Miniflare and jsdom on the patched Undici 7 release.
  undici: 7.30.1
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
